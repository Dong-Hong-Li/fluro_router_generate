name: Release

# 本地用 act 跑时：M 芯片 Mac 需加 --container-architecture linux/amd64，否则 Set up Flutter 会报
# "Unable to determine Flutter version ... architecture: arm64"。例：act --pull=false --container-architecture linux/amd64

# 让基于 Node 的 actions 使用 Node 24，避免 checkout 等在 Node 20 弃用告警 / 未来失败。
# 见：https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# -----------------------------------------------------------------------------
# on：触发条件
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'test/**'
      - 'example/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'test/**'
      - 'example/**'
      - '.github/workflows/**'

# -----------------------------------------------------------------------------
# 常见设计：拆成两个 job
# - test：推分支 / PR 时跑（保证合入前有测试）
# - publish：只推 tag 时跑（做完整检查 + 发布）
# -----------------------------------------------------------------------------
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # 非 tag 推送时才跑（即：推 main/develop 或 PR 时跑；推 tag 时不跑，交给 publish）
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v6

      # 安装 Flutter（需自带 Dart ≥ pubspec environment.sdk，当前为 ^3.8.1）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      # 安装库本体依赖
      - name: Install dependencies (root)
        run: flutter pub get

      # 安装 example 依赖（example 的生成产物 .router.g.dart 被 .gitignore 排除，
      # CI 上 deferred_generation_regression_test.dart 依赖这些文件，必须现场重新生成）
      - name: Install dependencies (example)
        working-directory: example
        run: flutter pub get

      # 在 example 内运行 build_runner 重新生成路由表（.router.g.dart），
      # 否则 test/deferred_generation_regression_test.dart 会因为找不到生成文件而失败。
      - name: Generate router code (example)
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      # 静态分析（PR/推分支时就能发现 lint/analyze 问题）
      - name: Static analysis
        run: dart analyze --fatal-warnings --fatal-infos

      # 执行所有测试
      - name: Run tests
        run: flutter test

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    # 只有推了 v 开头的 tag 时才跑
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      # 安装 Flutter（需自带 Dart ≥ pubspec environment.sdk，当前为 ^3.8.1）
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (example)
        working-directory: example
        run: flutter pub get

      - name: Generate router code (example)
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs

      # 格式化代码（保持仓库现有约定：只 format 不 fail）
      - name: Format code
        run: dart format .

      # 静态分析
      - name: Static analysis
        run: dart analyze --fatal-warnings --fatal-infos

      # 执行所有测试
      - name: Run tests
        run: flutter test

      # - name: Publish to pub.dev
      #   run: dart pub publish --force
      #   env:
      #     PUB_DEV_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}
