name: fluro_router_generate
description: A powerful Flutter library for routing based on Fluro, featuring annotations and code generation, with animated transitions, route matching, and support for custom navigation.
version: 1.1.0
repository: https://gitee.com/lidonghonglalala/fluro_router_generate
homepage: https://gitee.com/lidonghonglalala/fluro_router_generate 
environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
    
  # 用于从 ClassElement 读取构造函数参数类型（^9.0.0 兼容 Flutter 的 meta 1.16.0，10.x 需 meta ^1.18.0）
  analyzer: ^8.0.0


  # 代码生成器
  source_gen: ^4.2.0

  # 构建器
  build: ^4.0.4
  build_runner: ^2.11.1
  glob: ^2.1.3

  # 代码规范检查（与主项目保持一致）
  flutter_lints: ">=5.0.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  crypto: ^3.0.7
  package_config: ^2.2.0